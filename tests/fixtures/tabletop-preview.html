<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabletop viewport checks</title><style>body{margin:0;background:#242731;color:#fff2ce;font:14px system-ui}nav{padding:12px;position:sticky;top:0;background:#242731;z-index:2;display:flex;gap:8px;align-items:center}button{padding:12px;border:1px solid #b78951;background:#fff2ce;color:#25352b;border-radius:4px}iframe{display:block;width:375px;height:1250px;border:0;margin:0 auto;background:#fff2ce}output{margin-left:auto}main{overflow:auto}</style><nav><button data-width="375">Mobile 375</button><button data-width="768">Tablet 768</button><button data-width="1280">Desktop 1280</button><output>375 px</output></nav><main><iframe title="Game viewport" src="../../index.html"></iframe></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{document.querySelector('iframe').style.width=button.dataset.width+'px';document.querySelector('output').textContent=button.dataset.width+' px';});</script></html>
