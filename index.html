<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#182c29"><title>Card Wars · Battlefield</title><link rel="stylesheet" href="kingdom-clash/reboot/style.css?v=reboot1"></head>
<body><main id="game">
<header class="status"><div class="side"><span class="emblem">✦</span><div class="person"><small>YOUR FIELD</small><strong>Farmer</strong><i><span id="bar0"></span></i></div><b id="hp0">25</b></div><div class="center"><small>CARD WARS</small><strong id="round">WAVE 1</strong><em id="state">LIVE BATTLE</em></div><div class="side foe"><b id="hp1">25</b><div class="person"><small>RIVAL FIELD</small><strong>Jake</strong><i><span id="bar1"></span></i></div><span class="emblem">◆</span></div></header>
<section class="world" aria-label="Living 3D battlefield"><canvas id="battlefield" aria-label="Four physical landscape lanes with autonomous miniatures. Drag to orbit, tap a landscape to inspect it."></canvas><div class="scene-label"><small>THE TABLE</small><strong id="viewName">THE FOUR FIELDS</strong></div><button id="overview" hidden>← WHOLE TABLE</button></section>
<footer class="hud"><nav class="lane-picker" aria-label="View a lane"><button data-lane="0" aria-pressed="false"><b>01</b> CORN</button><button data-lane="1" aria-pressed="false"><b>02</b> BLUE</button><button data-lane="2" aria-pressed="false"><b>03</b> ICE</button><button data-lane="3" aria-pressed="false"><b>04</b> SWAMP</button></nav><div class="control-line"><div class="camera" aria-label="Camera"><button data-cam="left" aria-label="Orbit left">↶</button><button data-cam="right" aria-label="Orbit right">↷</button><button data-cam="down" aria-label="Lower camera">↘</button><button data-cam="up" aria-label="Raise camera">↗</button><button data-cam="out" aria-label="Zoom out">−</button><button data-cam="in" aria-label="Zoom in">＋</button><button data-cam="reset" aria-label="Reset camera">⌂</button></div><div class="sim"><button id="pause" aria-label="Pause simulation">Ⅱ</button><button id="speed" aria-label="Simulation speed">1×</button><button id="restart" aria-label="Restart battle">↺</button></div></div><div class="chronicle"><span id="time">00:00</span><strong id="event">The living battlefield wakes.</strong></div></footer>
</main><script type="module" src="kingdom-clash/reboot/main.js?v=reboot1"></script></body></html>
