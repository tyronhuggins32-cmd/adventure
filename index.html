<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b28"><title>Card Wars · Living Table</title><link rel="stylesheet" href="kingdom-clash/card-wars/style.css?v=table3"></head><body><main id="app">
<header class="status"><div class="player"><span class="sigil">✦</span><div class="name"><small>YOUR TABLE</small><strong>Farmer</strong><i><span id="yourBar"></span></i></div><b class="health" id="yourHp">25</b></div><div class="round"><small>CARD WARS · LIVING TABLE</small><strong id="round">ROUND ONE</strong><em>BUILD · PLAY · BATTLE</em></div><div class="player rival"><b class="health" id="rivalHp">25</b><div class="name"><small>RIVAL TABLE</small><strong>Jake</strong><i><span id="rivalBar"></span></i></div><span class="sigil">◆</span></div></header>
<section class="stage" aria-label="Physical card battle table"><canvas id="table" aria-label="Four field tabletop. Tap a field to place the selected card; drag to orbit the camera."></canvas><div class="stage-title"><small>THE TABLETOP</small><strong id="viewName">THE LIVING TABLE</strong></div><button id="home" hidden>← WHOLE TABLE</button><nav class="field-tabs" aria-label="Fields"><button data-lane="0"><b>01</b> EMPTY FIELD</button><button data-lane="1"><b>02</b> EMPTY FIELD</button><button data-lane="2"><b>03</b> EMPTY FIELD</button><button data-lane="3"><b>04</b> EMPTY FIELD</button></nav></section>
<div class="camera" aria-label="Camera controls"><small>CAMERA</small><button data-camera="left" aria-label="Orbit left">↶</button><button data-camera="right" aria-label="Orbit right">↷</button><button data-camera="down" aria-label="Lower camera">↘</button><button data-camera="up" aria-label="Raise camera">↗</button><button data-camera="out" aria-label="Zoom out">−</button><button data-camera="in" aria-label="Zoom in">＋</button><button data-camera="reset" aria-label="Reset camera">⌂</button></div>
<section class="hand" aria-label="Cards in hand"><div class="hand-head"><span id="ap" class="resource">0/4</span><div><small id="step">01 / BUILD THE WORLD</small><strong id="drawLabel">LANDSCAPE DECK</strong></div><em id="apLabel">FIELDS</em></div><div id="cards" class="cards"></div></section>
<footer class="action-bar"><div class="instruction"><small id="notice">Choose a landscape card, then tap a numbered field.</small><strong id="prompt">Choose a landscape card, then tap one of your four fields.</strong></div><button id="action" disabled>PLACE FOUR FIELDS</button></footer>
</main><script type="module" src="kingdom-clash/card-wars/app.js?v=table3"></script></body></html>
