<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151d20">
  <title>Card Wars · Living Table</title>
  <link rel="stylesheet" href="kingdom-clash/tabletop-v2/battle.css?v=field15">
</head>
<body>
<main id="game">
  <header class="heads-up">
    <div class="combatant"><span class="crest">✦</span><div><small>THE CORNLANDS</small><strong>Farmer</strong><span class="life"><i id="ownBar"></i></span></div><b id="ownHealth">25</b></div>
    <div class="round"><small>CARD WARS · LIVING TABLE</small><strong id="round">ROUND 1</strong><span id="phaseLabel">BATTLE LIVE</span></div>
    <div class="combatant rival"><b id="foeHealth">25</b><div><small>RIVAL FIELD</small><strong>Jake</strong><span class="life"><i id="foeBar"></i></span></div><span class="crest">◆</span></div>
  </header>
  <section class="viewport" aria-label="Living tabletop battlefield">
    <canvas id="board" aria-label="Four living battlefield lanes. Tap a lane for a close view; drag to move the camera."></canvas>
    <div class="scene-title"><small>THE TABLETOP</small><strong id="viewTitle">FOUR LIVING LANDSCAPES</strong><span id="sceneInfo">Miniatures think, move and fight on the table.</span></div>
    <div class="battle-mark" id="battleMark">● LIVE SIMULATION</div>
    <div class="lane-rail" aria-label="Inspect landscapes">
      <button data-lane="0"><span>01</span><strong>Cornlands</strong></button>
      <button data-lane="1"><span>02</span><strong>Blue Plains</strong></button>
      <button data-lane="2"><span>03</span><strong>Frozen Lake</strong></button>
      <button data-lane="3"><span>04</span><strong>Swamp</strong></button>
    </div>
    <div class="view-control"><button id="prevLane" aria-label="Previous lane">‹</button><button id="allLanes">ALL LANES</button><button id="nextLane" aria-label="Next lane">›</button></div>
    <div class="camera" aria-label="Camera controls"><button data-cam="left" aria-label="Pan left">←</button><button data-cam="orbit" aria-label="Orbit">⟳</button><button data-cam="right" aria-label="Pan right">→</button><button data-cam="tiltDown" aria-label="Lower camera">↘</button><button data-cam="tiltUp" aria-label="Raise camera">↗</button><button data-cam="zoomOut" aria-label="Zoom out">−</button><button data-cam="zoomIn" aria-label="Zoom in">＋</button><button data-cam="reset" aria-label="Reset camera">⌂</button></div>
  </section>
  <footer class="battle-bar"><div class="live-readout"><small id="clock">00:00 · ROUND 1</small><strong id="event">The battlefield is alive.</strong></div><div class="sim-actions"><button id="pause" aria-label="Pause battle">Ⅱ</button><button id="speed" aria-label="Simulation speed">1×</button><button id="restart">NEW BATTLE</button></div></footer>
</main>
<script type="module" src="kingdom-clash/tabletop-v2/app.js?v=field15"></script>
</body></html>
