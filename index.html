<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Living Fields</title><link rel="stylesheet" href="kingdom-clash/card-wars/field.css?v=1"></head><body><main id="app"><header><div><small>THE LIVING TABLE</small><h1>Field simulation</h1></div><div id="clock">DAY 01</div></header><section id="world"><canvas id="table" aria-label="Living terrain simulation. Tap a region to inspect it; drag to orbit."></canvas><div id="focus"><span id="fieldName">THE WHOLE WORLD</span><button id="home" hidden>All fields</button></div><nav id="lanes" aria-label="Field regions"></nav></section><aside id="controls"><button data-camera="left" aria-label="Orbit left">↶</button><button data-camera="right" aria-label="Orbit right">↷</button><button data-camera="down" aria-label="Lower camera">↘</button><button data-camera="up" aria-label="Raise camera">↗</button><button data-camera="out" aria-label="Zoom out">−</button><button data-camera="in" aria-label="Zoom in">＋</button><button data-camera="reset" aria-label="Reset camera">⌂</button></aside><section id="ecology"><div><small>WORLD EDITOR</small><h2 id="heading">Choose the ground</h2><p id="description">Tap a region, then change its terrain. The world continues moving on its own.</p></div><div id="terrain"></div><div id="inspector"></div></section><footer><span id="event">Four regions. One living world.</span><button id="pause">Pause</button><button id="newWorld">New world</button></footer></main><script type="module" src="kingdom-clash/card-wars/field-app.js?v=episode1"></script></body></html>
